# This rule is not used by the project csm-dr itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the dr.storage.dell.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: csm-dr
    app.kubernetes.io/managed-by: kustomize
  name: volumejournal-editor-role
rules:
  - apiGroups:
      - dr.storage.dell.com
    resources:
      - volumejournals
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - dr.storage.dell.com
    resources:
      - volumejournals/status
    verbs:
      - get
