# This rule is not used by the project csm-dr itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to dr.storage.dell.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: csm-dr
    app.kubernetes.io/managed-by: kustomize
  name: volumejournal-viewer-role
rules:
  - apiGroups:
      - dr.storage.dell.com
    resources:
      - volumejournals
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - dr.storage.dell.com
    resources:
      - volumejournals/status
    verbs:
      - get
